<rect x="0" y="0" width="1180" height="3" fill="url(#gg)"/><text x="40" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#D4AF5A">DIAGRAM 03</text><text x="40" y="86" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F5F0E8">Same job. Three readers. Three promises.</text><text x="40" y="112" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="start">Who is reading changes what you promise. The skill picks the row for you.</text><rect x="40" y="168" width="352" height="258" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="40" y="168" width="352" height="4" rx="2" fill="#4D3B18"/><text x="66" y="212" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#F5F0E8">AGENCY OWNER</text><text x="66" y="248" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">LIES AWAKE ABOUT</text><text x="66" y="274" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5C98B" text-anchor="start">revenue</text><line x1="66" y1="322" x2="366" y2="322" stroke="rgba(245,240,232,0.12)"/><text x="66" y="348" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">SO YOU PROMISE</text><text x="66" y="372" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">10 new client calls in 60</text><text x="66" y="392" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">days, or you don't pay</text><rect x="428" y="168" width="352" height="258" rx="12" fill="url(#card)" stroke="rgba(212,175,90,0.28)"/><rect x="428" y="168" width="352" height="4" rx="2" fill="#D4AF5A"/><text x="454" y="212" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#F5F0E8">VP OF TALENT</text><text x="454" y="248" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">LIES AWAKE ABOUT</text><text x="454" y="274" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5C98B" text-anchor="start">the number their CEO asks</text><text x="454" y="296" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5C98B" text-anchor="start">about</text><line x1="454" y1="322" x2="754" y2="322" stroke="rgba(245,240,232,0.12)"/><text x="454" y="348" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">SO YOU PROMISE</text><text x="454" y="372" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">Time-to-fill under 21 days on</text><text x="454" y="392" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">your hardest reqs</text><rect x="816" y="168" width="352" height="258" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="816" y="168" width="352" height="4" rx="2" fill="#4D3B18"/><text x="842" y="212" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#F5F0E8">RECRUITING COORDINATOR</text><text x="842" y="248" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">LIES AWAKE ABOUT</text><text x="842" y="274" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E5C98B" text-anchor="start">chaos</text><line x1="842" y1="322" x2="1142" y2="322" stroke="rgba(245,240,232,0.12)"/><text x="842" y="348" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="rgba(245,240,232,0.45)">SO YOU PROMISE</text><text x="842" y="372" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">8 hours a week back from phone</text><text x="842" y="392" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F0E8" text-anchor="start">screening</text><rect x="40" y="446" width="1100" height="46" rx="10" fill="#141416" stroke="rgba(245,240,232,0.12)"/><text x="590.0" y="475" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="middle">Write to the number the <tspan fill="#D4AF5A">person</tspan> is measured on, never the number the <tspan fill="#D4AF5A">company</tspan> reports.</text><line x1="40" y1="528" x2="1140" y2="528" stroke="rgba(245,240,232,0.12)"/><text x="40" y="552" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#D4AF5A" opacity="0.75">MACARTHUR MEDIA</text><text x="1140" y="552" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#C9BBA1" opacity="0.6" text-anchor="end">FOR INLET RECRUITING</text></svg>