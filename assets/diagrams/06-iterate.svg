<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="1180" height="580" role="img" aria-label="After you send">
<defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4D3B18"/><stop offset="0.5" stop-color="#D4AF5A"/><stop offset="1" stop-color="#4D3B18"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#111113"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D4AF5A"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9BBA1" opacity="0.6"/></marker>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1180" height="580" fill="#0C0C0E"/>
<rect x="0" y="0" width="1180" height="3" fill="url(#gg)"/><text x="40" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#D4AF5A">DIAGRAM 06</text><text x="40" y="86" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F5F0E8">What happens after you send</text><text x="40" y="112" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="start">The skill's job ends at the draft. This loop is what makes the next draft better.</text><rect x="40" y="176" width="254" height="190" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="64" y="210" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#D4AF5A">SEND</text><text x="64" y="244" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">500 to 1000 of one</text><text x="64" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">version</text><line x1="64" y1="292" x2="270" y2="292" stroke="rgba(245,240,232,0.12)"/><text x="64" y="314" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">Below 500, a 2-reply</text><text x="64" y="331" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">difference is luck.</text><line x1="302" y1="270" x2="320" y2="270" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="330" y="176" width="254" height="190" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="354" y="210" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#D4AF5A">CHANGE ONE THING</text><text x="354" y="244" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">Subject, or offer, or</text><text x="354" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">CTA</text><line x1="354" y1="292" x2="560" y2="292" stroke="rgba(245,240,232,0.12)"/><text x="354" y="314" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">Never two. Two changes tell</text><text x="354" y="331" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">you nothing.</text><line x1="592" y1="270" x2="610" y2="270" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="620" y="176" width="254" height="190" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="644" y="210" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#D4AF5A">TRACK THE FUNNEL</text><text x="644" y="244" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">Replies → calls →</text><text x="644" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">placements</text><line x1="644" y1="292" x2="850" y2="292" stroke="rgba(245,240,232,0.12)"/><text x="644" y="314" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">Reply rate can rise while</text><text x="644" y="331" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">placements fall.</text><line x1="882" y1="270" x2="900" y2="270" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="910" y="176" width="254" height="190" rx="12" fill="url(#card)" stroke="rgba(212,175,90,0.28)"/><text x="934" y="210" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#D4AF5A">KEEP OR KILL</text><text x="934" y="244" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">Beat the champion, or</text><text x="934" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="start">die</text><line x1="934" y1="292" x2="1140" y2="292" stroke="rgba(245,240,232,0.12)"/><text x="934" y="314" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">Winner becomes the new</text><text x="934" y="331" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9BBA1" text-anchor="start">baseline.</text><path d="M 1037.0 366 L 1037.0 410 L 457.0 410 L 457.0 374" fill="none" stroke="#D4AF5A" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)" opacity="0.7"/><text x="590.0" y="440" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="middle">Then do it again. Copy you expect to flop routinely wins, which is why you test instead of argue.</text><line x1="40" y1="528" x2="1140" y2="528" stroke="rgba(245,240,232,0.12)"/><text x="40" y="552" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#D4AF5A" opacity="0.75">MACARTHUR MEDIA</text><text x="1140" y="552" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#C9BBA1" opacity="0.6" text-anchor="end">FOR INLET RECRUITING</text></svg>