<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-label="Anatomy of the email">
<defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4D3B18"/><stop offset="0.5" stop-color="#D4AF5A"/><stop offset="1" stop-color="#4D3B18"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#111113"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D4AF5A"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9BBA1" opacity="0.6"/></marker>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1180" height="700" fill="#0C0C0E"/>
<rect x="0" y="0" width="1180" height="3" fill="url(#gg)"/><text x="40" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#D4AF5A">DIAGRAM 04</text><text x="40" y="86" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F5F0E8">Four jobs, about ninety words</text><text x="40" y="112" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="start">Each part has one job, then hands off to the next.</text><rect x="40" y="156" width="560" height="430" rx="12" fill="#1C1C1F" stroke="rgba(212,175,90,0.28)"/><rect x="40" y="156" width="560" height="46" rx="12" fill="#141416"/><rect x="40" y="190" width="560" height="12" fill="#141416"/><circle cx="66" cy="179" r="5" fill="#A6432E" opacity="0.75"/><circle cx="86" cy="179" r="5" fill="#D4AF5A" opacity="0.75"/><circle cx="106" cy="179" r="5" fill="#4F7D5B" opacity="0.75"/><text x="140" y="184" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(245,240,232,0.45)">to: vp.talent@northsidehealth.org</text><text x="72" y="240" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#E5C98B">Saw you're hiring 14 RNs across three sites.</text><text x="72" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#E5C98B">That's a lot of screening.</text><text x="72" y="318" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#F5F0E8">I fill nursing reqs for a 9-hospital system</text><text x="72" y="344" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#F5F0E8">in Ohio. 60 placements last year.</text><text x="72" y="396" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#D4AF5A">I'll fill 6 of yours in 45 days or you</text><text x="72" y="422" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#D4AF5A">pay nothing.</text><text x="72" y="474" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#F5F0E8">15 minutes Thursday at 3:30?</text><text x="72" y="526" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#C9BBA1">Taylor</text><line x1="608" y1="250" x2="654" y2="250" stroke="#D4AF5A" stroke-width="1.4" opacity="0.6" marker-end="url(#ar)"/><rect x="664" y="210" width="476" height="80" rx="10" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><circle cx="694" cy="250" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="694" y="255" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">1</text><text x="722" y="242" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">HOOK</text><text x="778" y="242" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D4AF5A">Buys 3 seconds</text><text x="722" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Proves a human looked at their world.</text><line x1="608" y1="348" x2="654" y2="348" stroke="#D4AF5A" stroke-width="1.4" opacity="0.6" marker-end="url(#ar)"/><rect x="664" y="308" width="476" height="80" rx="10" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><circle cx="694" cy="348" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="694" y="353" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">2</text><text x="722" y="340" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">PROOF</text><text x="788" y="340" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D4AF5A">Buys 5 seconds</text><text x="722" y="364" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Proves you've done it for someone like them.</text><line x1="608" y1="446" x2="654" y2="446" stroke="#D4AF5A" stroke-width="1.4" opacity="0.6" marker-end="url(#ar)"/><rect x="664" y="406" width="476" height="80" rx="10" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><circle cx="694" cy="446" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="694" y="451" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">3</text><text x="722" y="438" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">OFFER</text><text x="788" y="438" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D4AF5A">Buys the reply</text><text x="722" y="462" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Puts the risk on you, not on them.</text><line x1="608" y1="544" x2="654" y2="544" stroke="#D4AF5A" stroke-width="1.4" opacity="0.6" marker-end="url(#ar)"/><rect x="664" y="504" width="476" height="80" rx="10" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><circle cx="694" cy="544" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="694" y="549" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">4</text><text x="722" y="536" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">ASK</text><text x="768" y="536" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D4AF5A">Gets the calendar</text><text x="722" y="560" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">One decision. Not a negotiation.</text><text x="40" y="616" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1">Rule of thumb: delete every other email in the sequence, and this one still does the whole job on its own.</text><line x1="40" y1="648" x2="1140" y2="648" stroke="rgba(245,240,232,0.12)"/><text x="40" y="672" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#D4AF5A" opacity="0.75">MACARTHUR MEDIA</text><text x="1140" y="672" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#C9BBA1" opacity="0.6" text-anchor="end">FOR INLET RECRUITING</text></svg>