<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img" aria-label="Why it asks three questions">
<defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4D3B18"/><stop offset="0.5" stop-color="#D4AF5A"/><stop offset="1" stop-color="#4D3B18"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#111113"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D4AF5A"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9BBA1" opacity="0.6"/></marker>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1180" height="660" fill="#0C0C0E"/>
<rect x="0" y="0" width="1180" height="3" fill="url(#gg)"/><text x="40" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#D4AF5A">DIAGRAM 02</text><text x="40" y="86" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F5F0E8">Why it asks you three questions first</text><text x="40" y="112" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="start">Same product, same sender. Three different emails, because the reader is different.</text><rect x="40" y="170" width="300" height="96" rx="12" fill="url(#card)" stroke="rgba(212,175,90,0.28)"/><text x="62" y="200" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#D4AF5A">INDUSTRY</text><text x="62" y="232" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F0E8">healthcare staffing</text><text x="62" y="252" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(245,240,232,0.45)">what you tell it</text><line x1="352" y1="218" x2="424" y2="218" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="436" y="170" width="364" height="96" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="458" y="202" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F0E8">Sets the vocabulary</text><text x="458" y="228" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">"travel nurse fill rate",</text><text x="458" y="247" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">not "talent solutions"</text><line x1="812" y1="218" x2="876" y2="218" stroke="#C9BBA1" stroke-width="1.4" opacity="0.4" marker-end="url(#arm)"/><rect x="40" y="288" width="300" height="96" rx="12" fill="url(#card)" stroke="rgba(212,175,90,0.28)"/><text x="62" y="318" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#D4AF5A">ROLE</text><text x="62" y="350" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F0E8">VP of Talent</text><text x="62" y="370" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(245,240,232,0.45)">what you tell it</text><line x1="352" y1="336" x2="424" y2="336" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="436" y="288" width="364" height="96" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="458" y="320" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F0E8">Sets the promise</text><text x="458" y="346" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">A VP is measured on time-to-fill.</text><text x="458" y="365" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">So promise time-to-fill.</text><line x1="812" y1="336" x2="876" y2="336" stroke="#C9BBA1" stroke-width="1.4" opacity="0.4" marker-end="url(#arm)"/><rect x="40" y="406" width="300" height="96" rx="12" fill="url(#card)" stroke="rgba(212,175,90,0.28)"/><text x="62" y="436" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#D4AF5A">BUSINESS TYPE</text><text x="62" y="468" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F0E8">12-hospital system</text><text x="62" y="488" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(245,240,232,0.45)">what you tell it</text><line x1="352" y1="454" x2="424" y2="454" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="436" y="406" width="364" height="96" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><text x="458" y="438" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F0E8">Sets the size of the promise</text><text x="458" y="464" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">"6 RN reqs per site",</text><text x="458" y="483" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">not "hundreds of hires"</text><line x1="812" y1="454" x2="876" y2="454" stroke="#C9BBA1" stroke-width="1.4" opacity="0.4" marker-end="url(#arm)"/><rect x="890" y="170" width="250" height="332" rx="12" fill="#141416" stroke="rgba(212,175,90,0.28)"/><text x="1015" y="212" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#D4AF5A" text-anchor="middle">THE RESULT</text><text x="1015" y="252" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="middle">One email that sounds</text><text x="1015" y="276" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="middle">like it was written by</text><text x="1015" y="300" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="middle">someone who actually</text><text x="1015" y="324" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F0E8" text-anchor="middle">works in their world.</text><line x1="930" y1="382" x2="1100" y2="382" stroke="rgba(212,175,90,0.28)"/><text x="1015" y="414" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9BBA1" text-anchor="middle">Not a template with</text><text x="1015" y="433" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9BBA1" text-anchor="middle">their company name</text><text x="1015" y="452" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9BBA1" text-anchor="middle">pasted into it.</text><rect x="40" y="522" width="1100" height="58" rx="12" fill="#160F0E" stroke="rgba(166,67,46,0.35)"/><text x="64" y="548" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#A6432E">THE TRAP IT AVOIDS</text><text x="64" y="568" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1">Skip the intake and AI writes: "I love your passion for talent acquisition." No VP of Talent has ever enjoyed reading that.</text><line x1="40" y1="608" x2="1140" y2="608" stroke="rgba(245,240,232,0.12)"/><text x="40" y="632" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#D4AF5A" opacity="0.75">MACARTHUR MEDIA</text><text x="1140" y="632" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#C9BBA1" opacity="0.6" text-anchor="end">FOR INLET RECRUITING</text></svg>