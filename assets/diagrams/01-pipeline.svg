<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img" aria-label="The pipeline">
<defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4D3B18"/><stop offset="0.5" stop-color="#D4AF5A"/><stop offset="1" stop-color="#4D3B18"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#111113"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D4AF5A"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9BBA1" opacity="0.6"/></marker>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1180" height="620" fill="#0C0C0E"/>
<rect x="0" y="0" width="1180" height="3" fill="url(#gg)"/><text x="40" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#D4AF5A">DIAGRAM 01</text><text x="40" y="86" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F5F0E8">What happens when you run it</text><text x="40" y="112" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#C9BBA1" text-anchor="start">You type one sentence. Five things happen before a draft reaches you.</text><rect x="40" y="190" width="196" height="150" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="40" y="190" width="196" height="150" rx="12" fill="none" stroke="rgba(212,175,90,0.28)"/><circle cx="70" cy="222" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="70" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">00</text><text x="96" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">INTAKE</text><text x="60" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Asks 3 questions</text><text x="60" y="286" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">before writing</text><line x1="242" y1="265" x2="260" y2="265" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="268" y="190" width="196" height="150" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="268" y="190" width="196" height="150" rx="12" fill="none" stroke="rgba(245,240,232,0.12)"/><circle cx="298" cy="222" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="298" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">01</text><text x="324" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">DRAFT</text><text x="288" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Writes the</text><text x="288" y="286" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">four-part email</text><line x1="470" y1="265" x2="488" y2="265" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="496" y="190" width="196" height="150" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="496" y="190" width="196" height="150" rx="12" fill="none" stroke="rgba(245,240,232,0.12)"/><circle cx="526" cy="222" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="526" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">02</text><text x="552" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">PERSUADE</text><text x="516" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Cuts anything that</text><text x="516" y="286" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">isn't a benefit</text><line x1="698" y1="265" x2="716" y2="265" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="724" y="190" width="196" height="150" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="724" y="190" width="196" height="150" rx="12" fill="none" stroke="rgba(245,240,232,0.12)"/><circle cx="754" cy="222" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="754" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">03</text><text x="780" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">HUMANIZE</text><text x="744" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Strips 53 tells that</text><text x="744" y="286" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">smell like ChatGPT</text><line x1="926" y1="265" x2="944" y2="265" stroke="#D4AF5A" stroke-width="1.6" marker-end="url(#ar)" opacity="0.8"/><rect x="952" y="190" width="196" height="150" rx="12" fill="url(#card)" stroke="rgba(245,240,232,0.12)"/><rect x="952" y="190" width="196" height="150" rx="12" fill="none" stroke="rgba(212,175,90,0.28)"/><circle cx="982" cy="222" r="15" fill="#4D3B18" stroke="#D4AF5A" stroke-opacity="0.5"/><text x="982" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E5C98B" text-anchor="middle">04</text><text x="1008" y="227" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#F5F0E8">GRADE</text><text x="972" y="266" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">Marks its own</text><text x="972" y="286" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1">homework</text><path d="M 1050.0 340 L 1050.0 396 L 366.0 396 L 366.0 348" fill="none" stroke="#A6432E" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)" opacity="0.85"/><text x="708.0" y="418" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#C9BBA1" text-anchor="middle">Fails its own grade? It rewrites. You never see the weak version.</text><rect x="40" y="454" width="1100" height="74" rx="12" fill="#141416" stroke="rgba(212,175,90,0.28)"/><text x="64" y="486" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D4AF5A">WHY THE LOOP MATTERS</text><text x="64" y="510" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#F5F0E8">A bad cold email doesn't get a "no". It gets silence. The grader is the only thing between a weak draft and 800 sends of it.</text><line x1="40" y1="568" x2="1140" y2="568" stroke="rgba(245,240,232,0.12)"/><text x="40" y="592" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#D4AF5A" opacity="0.75">MACARTHUR MEDIA</text><text x="1140" y="592" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#C9BBA1" opacity="0.6" text-anchor="end">FOR INLET RECRUITING</text></svg>